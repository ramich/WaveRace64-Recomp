<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Bright tropical sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a6fb0"/>
      <stop offset="45%" stop-color="#4aa8d8"/>
      <stop offset="72%" stop-color="#bfe9f7"/>
      <stop offset="100%" stop-color="#eafbff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="94%" r="60%">
      <stop offset="0%"  stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffe39a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffe39a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fd0e0"/><stop offset="100%" stop-color="#159fb6"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17a6c0"/><stop offset="100%" stop-color="#0c7186"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7d95"/><stop offset="100%" stop-color="#064e60"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#bff1fb"/>
    </linearGradient>
    <!-- Central vignette so the menu text stays readable over vivid water -->
    <radialGradient id="vig" cx="50%" cy="52%" r="62%">
      <stop offset="0%"  stop-color="#04141f" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#04141f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#04141f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#sun)"/>
  <circle cx="800" cy="620" r="120" fill="#fffbe6" opacity="0.5"/>

  <!-- sun glitter on the water -->
  <g opacity="0.35" fill="#fff4c8">
    <rect x="716" y="612" width="168" height="7" rx="3.5"/>
    <rect x="694" y="636" width="212" height="7" rx="3.5"/>
    <rect x="668" y="664" width="264" height="8" rx="4"/>
    <rect x="636" y="696" width="328" height="9" rx="4.5"/>
  </g>

  <!-- far swell -->
  <path fill="url(#w1)" d="M0 600 C 240 560,420 626,660 604 S 1080 552,1320 600 S 1520 578,1600 596 L1600 900 L0 900 Z"/>
  <path fill="url(#foam)" opacity="0.85" d="M0 600 C 240 560,420 626,660 604 S 1080 552,1320 600 S 1520 578,1600 596 L1600 612 C1520 592,1340 614,1320 614 S 900 566,660 616 S 240 574,0 612 Z"/>

  <!-- mid swell -->
  <path fill="url(#w2)" d="M0 706 C 300 656,560 736,860 708 S 1320 648,1600 704 L1600 900 L0 900 Z"/>
  <path fill="url(#foam)" opacity="0.9" d="M0 706 C 300 656,560 736,860 708 S 1320 648,1600 704 L1600 722 C1320 668,1100 726,860 724 S 300 672,0 724 Z"/>

  <!-- near breaking wave -->
  <path fill="url(#w3)" d="M0 806 C 340 748,600 838,940 802 S 1380 736,1600 796 L1600 900 L0 900 Z"/>
  <path fill="url(#foam)" d="M0 806 C 340 748,600 838,940 802 S 1380 736,1600 796 L1600 818 C1380 754,1150 820,940 822 S 340 764,0 826 Z"/>

  <!-- spray -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="450" cy="756" r="6"/><circle cx="492" cy="742" r="4"/><circle cx="424" cy="742" r="3.5"/>
    <circle cx="1180" cy="748" r="6"/><circle cx="1220" cy="734" r="4"/><circle cx="1150" cy="736" r="3.5"/>
  </g>

  <rect x="0" y="0" width="1600" height="900" fill="url(#vig)"/>
</svg>
